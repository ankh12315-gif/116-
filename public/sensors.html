<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>116配电室 · 传感器</title>
<style>body{background:#f7f5f0;color:#28372e;font:16px 'Microsoft YaHei',sans-serif;margin:32px auto;max-width:1100px;padding:0 20px}h1{font-size:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}article,section{background:#fffcf7;border:1px solid #e4ddd0;border-radius:18px;padding:20px;margin-bottom:16px}b{font-size:28px}small{display:block;color:#777;line-height:1.8}.alarm{border-color:#b84d32}input,select,button{font:inherit;padding:8px;border:1px solid #d9d1c4;border-radius:9px}button{background:#2c4537;color:white;cursor:pointer}pre{white-space:pre-wrap;font-size:13px}label{display:block;margin:8px 0}.error{color:#b84d32}</style>
<h1>116配电室 · 传感器查看</h1><p>当前为MOCK测试。柜体点为已核验的柜附近气相采样点，未确认柜内位置；缺失点使用明确标记的MOCK初始值。</p><p id="clock"></p><div id="grid" class="grid"></div>
<section><h2>传感器数据接入接口</h2><p>此表单用于测试真实设备上传格式，提交的数据会标为SENSOR；它仍是人工输入，不代表已有真实设备。上传后该通道停止MOCK，超过2秒未更新即失效。</p><form id="form"><label>传感器 <select id="sensor"></select></label><label>温度℃ <input id="temp" type="number" min="-50" max="2000" step="0.1" required value="20"></label><button>发送一条接口测试读数</button></form><p id="message"></p><pre id="example"></pre></section><section><h2>起火与匹配记录</h2><pre id="events"></pre></section>
<script>
const session=new URLSearchParams(location.search).get('session');let state;
const el=id=>document.getElementById(id);const text=(tag,value)=>{const n=document.createElement(tag);n.textContent=value;return n;};
async function refresh(){try{const r=await fetch('/api/state?session='+encodeURIComponent(session));const s=await r.json();if(!r.ok)throw Error(s.error);state=s;el('clock').textContent=`传感器模拟绝对时间 ${s.absoluteS.toFixed(1)}s · 实际起火后 ${s.actualS.toFixed(1)}s · FDS展示 ${s.displayFdsS.toFixed(1)}s`;
el('grid').replaceChildren();for(const row of [...s.cabinetSensors,{...s.beam,location:'梁下气相点'}]){const a=document.createElement('article');if(row.alarm)a.className='alarm';a.append(text('h3',row.id),text('b',row.valueC===null?'不可用':row.valueC.toFixed(1)+'℃'),text('small','来源：'+row.source),text('small','坐标：'+(row.position?.join(', ')??'未覆盖')),text('small',row.location));if(row.id==='beam')a.append(text('small',`FDS ${row.rawFdsC?.toFixed(1)??'—'}℃ / 修正 ${row.correctedC?.toFixed(1)??'—'}℃ / 原误差 ${row.deltaC===null?'—':Math.abs(row.deltaC).toFixed(1)}℃ / 修正后误差 ${row.deltaC===null?'—':Math.max(0,Math.abs(row.deltaC)-20).toFixed(1)}℃`));el('grid').append(a);}
if(!el('sensor').options.length)for(const id of [...s.cabinetSensors.map(c=>c.id),'beam']){const o=text('option',id);o.value=id;el('sensor').append(o);}
el('events').textContent=JSON.stringify(s.events.slice(-10),null,2);el('example').textContent='POST /api/readings\n'+JSON.stringify({session,id:'beam',valueC:90,absoluteS:s.absoluteS,capturedAt:new Date().toISOString()},null,2);
}catch(e){el('clock').textContent=e.message;el('clock').className='error';}}
el('form').onsubmit=async e=>{e.preventDefault();if(!state)return;const r=await fetch('/api/readings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session,id:el('sensor').value,valueC:Number(el('temp').value),absoluteS:state.absoluteS,capturedAt:new Date().toISOString()})});const b=await r.json();el('message').textContent=r.ok?'已接收接口测试数据':b.error;refresh();};refresh();setInterval(refresh,1000);
</script></html>
