services:
  - type: web
    name: fire-116-visualization
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/setup
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: HOST
        value: 0.0.0.0
